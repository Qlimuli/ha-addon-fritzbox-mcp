name: "FRITZ!Box MCP Server"
version: "1.2.0"
slug: fritzbox_mcp
description: >-
  MCP + REST for AVM FRITZ!Box: Smart Home, WAN, WLAN channels/clients, Mesh,
  HostFilter (WAN block), DSL/LAN stats, reboot, firmware update check, WPS, diagnostics.
url: "https://github.com/Qlimuli/ha-addon-fritzbox-mcp"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: MCP HTTP/SSE + REST API endpoint
map:
  - type: addon_config
    read_only: false
options:
  host: "fritz.box"
  username: ""
  password: ""
  port: 3000
schema:
  host: str
  username: str
  password: password
  port: int
ingress: false
panel_icon: mdi:router-wireless
